extends: ../mirror-base.yml

name: crane

# Logical index package `google/crane` at the physical path
# `ghcr.io/ocx-contrib/google/crane` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
#
# ⚠️ THE UPSTREAM REPOSITORY IS `google/go-containerregistry`, NOT `google/crane`.
# crane is the CLI that repository ships (alongside gcrane and krane); the
# package segment is the name the project publishes the TOOL under, which is
# what a user types and what upstream's own install docs call it. The library
# repo name would name a Go module nobody installs with `ocx add`.
target:
  registry: ghcr.io
  repository: ocx-contrib/google/crane

source:
  type: github_release
  owner: google
  repo: go-containerregistry
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Pure-Go, cgo-free goreleaser build: upstream ships ONE Linux build per arch
# and every binary in it is fully static. Measured on v0.21.8 (newest) and
# re-checked on v0.21.6 (the oldest in range), all three binaries on both
# arches:
#
#   $ file go-containerregistry_Linux_x86_64/crane
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked,
#   Go BuildID=…, stripped                       (same for gcrane, krane)
#   $ readelf -l …/crane   | grep -c INTERP  → 0
#   $ readelf -d …/crane   | grep -c NEEDED  → 0
#
#   $ file go-containerregistry_Linux_arm64/crane
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically
#   linked, …                                    (same for gcrane, krane)
#   $ readelf -l …/crane   | grep -c INTERP  → 0
#   $ readelf -d …/crane   | grep -c NEEDED  → 0
#
#   $ file v0.21.6/crane
#   ELF 64-bit LSB executable, x86-64, statically linked, …   INTERP 0, NEEDED 0
#
# No PT_INTERP and no DT_NEEDED on any of them: the artifact requires NOTHING
# of the host userland, so both Linux keys are BARE. `os.features` states what
# the artifact REQUIRES, so tagging a static build `+libc.musl` would be a
# false requirement that hides it from every glibc host. Upstream publishes no
# musl/gnu split, so there is no second key to weigh.
#
# ../mirror-base.yml's matrix already matches that measurement exactly (bare
# Linux keys carrying the alpine leg that turns the universal claim into
# evidence), but `platforms:` IS restated below anyway — see the block at the
# bottom of this file for why the staged rollout forces it.
#
# ─── Scope (verified BOTH ways on v0.21.6, v0.21.7 and v0.21.8 — the whole
#     in-range set) ─────────────────────────────────────────────────────────
#
# Each pattern below was grepped against the FULL asset list of every in-range
# release: all six matched EXACTLY ONE asset on all three. A pattern matching
# zero is SILENTLY SKIPPED, not an error, so this check is the only thing
# standing between a typo and a green run with a missing platform.
#
# ⚠️ ASSET FILENAMES CARRY NO VERSION. `go-containerregistry_Linux_x86_64.tar.gz`
# is byte-for-byte the same NAME in v0.21.6 and v0.21.8 — the version lives
# only in the release tag and the download URL. So these patterns are fully
# literal, with no `.*` version hole to leak into a neighbouring arch. They are
# still anchored at both ends: `^` keeps a future `sig-…`/`att-…` prefix out and
# `$` keeps a future `.sha256`/`.sig`/`.asc` sidecar out — the routine way an
# unanchored pattern turns into an ambiguous >1 match on a later release.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   go-containerregistry-<version>.tar.gz  — goreleaser's auto-generated SOURCE
#                                            tarball. It is the ONLY asset with
#                                            no OS/arch token, and the only one
#                                            whose name is versioned; the `_`
#                                            (not `-`) after the project name in
#                                            every pattern below excludes it.
#   checksums.txt                          — checksum sidecar
#   multiple.intoto.jsonl                  — SLSA provenance attestation. Present
#                                            in v0.21.6/v0.21.7, ABSENT from
#                                            v0.21.8 — upstream's release process
#                                            is inconsistent about it. Nothing
#                                            here depends on it either way.
#   _Linux_{armv6,i386,ppc64le,riscv64,s390x}  — exotic Linux arches
#   _Linux_loong64                             — added between v0.21.6 and
#                                                v0.21.8; absent from 2 of the 3
#                                                in-range releases
#
# The exotic arches are not a judgement call: **OCX's architecture enum has
# only `amd64` and `arm64`** (`ocx_lib/src/oci/platform/architecture.rs` — the
# i386 / ARM / LoongArch64 / Mips variants are commented out as unsupported),
# so `linux/armv6`, `linux/386`, `linux/ppc64le`, `linux/riscv64`,
# `linux/s390x` and `linux/loong64` are upstream *assets* that cannot be
# expressed as platform keys at all. They are dropped, not excluded.
assets:
  linux/amd64:
    - "^go-containerregistry_Linux_x86_64\\.tar\\.gz$"
  linux/arm64:
    - "^go-containerregistry_Linux_arm64\\.tar\\.gz$"
  # ── PASS 2 (darwin) — LANDED ───────────────────────────────────────────────
  darwin/amd64:
    - "^go-containerregistry_Darwin_x86_64\\.tar\\.gz$"
  darwin/arm64:
    - "^go-containerregistry_Darwin_arm64\\.tar\\.gz$"
  # ── PASS 3 (windows) — LANDED. Upstream ships .tar.gz on Windows too, not .zip
  windows/amd64:
    - "^go-containerregistry_Windows_x86_64\\.tar\\.gz$"
  windows/arm64:
    - "^go-containerregistry_Windows_arm64\\.tar\\.gz$"

# ../mirror-base.yml sets `build_timestamp: none`, which is osv-scanner legacy
# (that coordinate had already published every in-range version at the bare
# tag). crane has no published history, so the fleet rule stands: a cascade tag
# re-points on every re-publish, and without a build segment the new manifest
# reuses the bare version tag and orphans the prior digest for registry GC,
# breaking any `@sha256:` pin in a consumer's `ocx.lock`. Safe as a plain
# scalar — the shallow-merge hazard only bites block-valued keys. The documented
# exception (a version that already carries semver build metadata, where `date`
# empties the mirror) does not apply: versions here are plain `0.21.8`.
build_timestamp: date

asset_type:
  # FLAT archive — no wrapper directory on ANY platform. Verified by `tar tzvf`
  # on Linux/x86_64, Linux/arm64, Darwin/arm64 and Windows/x86_64 of v0.21.8 and
  # on Linux/x86_64 of v0.21.6: every member sits at the archive root —
  #   LICENSE  README.md  crane  gcrane  krane        (crane.exe … on Windows)
  # so there is nothing to strip. `strip_components: 0` extracts them straight
  # to the content root, which is why metadata.json's PATH is a bare
  # ${installPath} and `bin_scan` stays `off` (see ../mirror-base.yml — the scan
  # only looks BELOW an ${installPath}/<dir> entry and would exit 65 here).
  type: archive
  strip_components: 0

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 0.21.6 is the recon-assigned floor. All three in-range releases (0.21.6,
  # 0.21.7, 0.21.8) pass the both-ways platform check above and share the same
  # flat archive layout and the same CLI surface tests/smoke.star asserts
  # (`append -f/-t/-o`, `validate --tarball`, `digest --tarball` all measured on
  # 0.21.6 and 0.21.8).
  min: "0.21.6"
  new_per_run: 5
  # Without this the generated workflow only fires on workflow_dispatch + push
  # and never auto-discovers a new upstream release.
  poll_interval: "32 0-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: crane/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# `extends:` is a SHALLOW merge of top-level keys: setting `platforms:` here
# replaces ../mirror-base.yml's block OUTRIGHT. It is restated in full and
# deliberately — every key this spec declares appears below with its complete
# `containers:` list, so nothing is silently dropped.
#
# WHY restate at all, when the base's block is libc-correct for crane? Because
# a platform declared here but absent from `assets:` does NOT cost nothing. The
# generated test matrix is static: the leg boots its runner, checks out, installs
# the toolchain, finds the platform missing from every version's resolved set,
# skips, and reports SUCCESS. That is macOS at 10× and Windows at 2× the minute
# rate to verify nothing, and a green tile that means nothing — the exact
# "declared-but-unmatched leg" failure. Pass 1 is Linux only, so Linux only is
# declared.
#
# PASS 2 / PASS 3: uncomment the matching `assets:` keys above AND the platform
# keys below in the same edit, by hand (never by sed — a replacement rewrites
# `\\.` to `\.` inside an asset regex), then re-run `generate ci` naming EVERY
# spec in this repository and re-validate.
#
# libc evidence for the bare keys is above `assets:`; the alpine leg is what
# makes the universal claim evidence rather than assertion.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── PASS 2 (darwin) — LANDED ───────────────────────────────────────────────
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  # ── PASS 3 (windows) — LANDED ──────────────────────────────────────────────
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/google/go-containerregistry/license --jq '.license.spdx_id'
  #   Apache-2.0
  # The LICENSE file also travels INSIDE every release archive, so the terms
  # ship with the redistributed bytes.
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: google/crane
  fork: ocx-contrib/index
