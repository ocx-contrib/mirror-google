extends: ../mirror-base.yml

name: ko

# Logical index package `google/ko` at the physical path
# `ghcr.io/ocx-contrib/google/ko` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/google/ko

source:
  type: github_release
  owner: google
  repo: ko
  # ⚠️ PRERELEASE CANNOT BE INFERRED FROM TAG TEXT HERE. `v0.15.3` is a clean
  # `vX.Y.Z` tag with no `-rc`/`-beta` suffix and is nonetheless flagged
  # `"prerelease": true` by the GitHub API:
  #   $ gh api repos/google/ko/releases --jq '.[] | "\(.tag_name) \(.prerelease)"'
  #   … v0.15.4 false / v0.15.3 TRUE / v0.15.2 false …
  # It sits well below this mirror's floor so nothing changes today, but the
  # regex below is deliberately NOT the prerelease filter — ../mirror-base.yml's
  # `skip_prereleases: true` reads the API's boolean, which is the only field
  # that actually knows.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Pure-Go, cgo-free goreleaser build: one Linux binary per arch, fully static.
# Measured on v0.19.1 (newest) and v0.18.1 (the oldest in range):
#
#   $ file ko_0.19.1_Linux_x86_64/ko
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked,
#   Go BuildID=…, stripped
#   $ readelf -l …/ko | grep -c INTERP  → 0
#   $ readelf -d …/ko | grep -c NEEDED  → 0
#
#   $ file ko_0.19.1_Linux_arm64/ko
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically
#   linked, …                            INTERP 0, NEEDED 0
#
#   $ file ko_0.18.1_Linux_x86_64/ko
#   ELF 64-bit LSB executable, x86-64, statically linked, …
#                                        INTERP 0, NEEDED 0
#
# No PT_INTERP and no DT_NEEDED anywhere: the artifact requires NOTHING of the
# host userland, so both Linux keys are BARE. `os.features` states what the
# artifact REQUIRES, so tagging a static build `+libc.musl` would be a false
# requirement that hides it from every glibc host. Upstream ships no musl/gnu
# split, so there is no second key to weigh. The alpine container leg is what
# turns the universal claim into evidence.
#
# ─── THE KO TRAP — why every pattern below carries a version token ──────────
#
# EVERY release ships each platform TWICE: a versioned asset
# `ko_<version>_<OS>_<arch>.tar.gz` AND an unversioned twin
# `ko_<OS>_<arch>.tar.gz`. Re-listed and confirmed on ALL THREE in-range tags,
# not just the recon sample:
#
#   $ gh api repos/google/ko/releases/tags/v0.19.1 --jq '.assets[].name'
#   … ko_0.19.1_Linux_x86_64.tar.gz … ko_Linux_x86_64.tar.gz …   (same in
#   v0.19.0 and v0.18.1, for all 12 platform legs)
#
# So this is release-automation behaviour, not a one-off. A loose pattern such
# as `ko_.*_Linux_x86_64\.tar\.gz` matches BOTH and fails the whole version
# with an ambiguous >1 match. Requiring a literal semver token immediately
# after `ko_`, plus the `$` anchor, selects the versioned asset and excludes
# the bare twin — the twin has nothing between `ko_` and `_Linux`.
#
# Verified BOTH ways on v0.18.1, v0.19.0 and v0.19.1: each of the six patterns
# matches EXACTLY ONE asset on every one of them. A pattern matching zero is
# SILENTLY SKIPPED, not an error — a green run with a missing platform.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   checksums.txt              — checksum sidecar
#   multiple.intoto.jsonl      — SLSA provenance attestation (present in
#                                v0.18.1 and v0.19.1, ABSENT from v0.19.0;
#                                upstream is inconsistent, nothing here cares)
#   ko_<OS>_<arch>.tar.gz      — the unversioned twins above
#   *_Linux_{i386,mips64le,ppc64le,riscv64,s390x}  — exotic Linux arches
#   *_Windows_i386                                  — 32-bit Windows
#
# The exotic arches are not a judgement call: **OCX's architecture enum has
# only `amd64` and `arm64`** (`ocx_lib/src/oci/platform/architecture.rs` — the
# i386 / ARM / LoongArch64 / Mips variants are commented out as unsupported),
# so `linux/386`, `linux/mips64le`, `linux/ppc64le`, `linux/riscv64`,
# `linux/s390x` and `windows/386` are upstream *assets* that cannot be
# expressed as platform keys at all. They are dropped, not excluded.
assets:
  linux/amd64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Linux_x86_64\\.tar\\.gz$"
  linux/arm64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Linux_arm64\\.tar\\.gz$"
  # ── PASS 2 (darwin) — LANDED ───────────────────────────────────────────────
  darwin/amd64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Darwin_x86_64\\.tar\\.gz$"
  darwin/arm64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Darwin_arm64\\.tar\\.gz$"
  # ── PASS 3 (windows) — LANDED. Upstream ships .tar.gz on Windows too, not .zip
  windows/amd64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Windows_x86_64\\.tar\\.gz$"
  windows/arm64:
    - "^ko_\\d+\\.\\d+\\.\\d+_Windows_arm64\\.tar\\.gz$"

# ../mirror-base.yml sets `build_timestamp: none`, which is osv-scanner legacy
# (that coordinate had already published every in-range version at the bare
# tag). ko has no published history, so the fleet rule stands: a cascade tag
# re-points on every re-publish, and without a build segment the new manifest
# reuses the bare version tag and orphans the prior digest for registry GC,
# breaking any `@sha256:` pin in a consumer's `ocx.lock`. Safe as a plain
# scalar — the shallow-merge hazard only bites block-valued keys. The documented
# exception (a version that already carries semver build metadata, where `date`
# empties the mirror) does not apply: versions here are plain `0.19.1`.
build_timestamp: date

asset_type:
  # FLAT archive — no wrapper directory on any platform. Verified by `tar tzvf`
  # on Linux/x86_64, Linux/arm64, Darwin/arm64 and Windows/x86_64 of v0.19.1 and
  # on Linux/x86_64 of v0.18.1: three members at the archive root —
  #   LICENSE  README.md  ko                        (ko.exe on Windows)
  # so there is nothing to strip. `strip_components: 0` extracts them straight
  # to the content root, which is why metadata.json's PATH is a bare
  # ${installPath} and `bin_scan` stays `off` (see ../mirror-base.yml — the scan
  # only looks BELOW an ${installPath}/<dir> entry and would exit 65 here).
  type: archive
  strip_components: 0

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 0.18.1 is the recon-assigned floor. All three in-range releases (0.18.1,
  # 0.19.0, 0.19.1) pass the both-ways platform check above, share the same flat
  # archive layout, and share the CLI surface tests/smoke.star asserts
  # (`version`, and `resolve --push=false -f` under KO_DOCKER_REPO — both
  # measured on 0.18.1 and 0.19.1).
  min: "0.18.1"
  new_per_run: 5
  # Without this the generated workflow only fires on workflow_dispatch + push
  # and never auto-discovers a new upstream release.
  poll_interval: "0 2-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: ko/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# `extends:` is a SHALLOW merge of top-level keys: setting `platforms:` here
# replaces ../mirror-base.yml's block OUTRIGHT. It is restated in full and
# deliberately — every key this spec declares appears below with its complete
# `containers:` list, so nothing is silently dropped.
#
# WHY restate at all, when the base's block is libc-correct for ko? Because a
# platform declared here but absent from `assets:` does NOT cost nothing. The
# generated test matrix is static: the leg boots its runner, checks out,
# installs the toolchain, finds the platform missing from every version's
# resolved set, skips, and reports SUCCESS. That is macOS at 10× and Windows at
# 2× the minute rate to verify nothing, and a green tile that means nothing.
# Pass 1 is Linux only, so Linux only is declared.
#
# PASS 2 / PASS 3: uncomment the matching `assets:` keys above AND the platform
# keys below in the same edit, by hand (never by sed — a replacement rewrites
# `\\.` to `\.` inside an asset regex), then re-run `generate ci` naming EVERY
# spec in this repository and re-validate.
#
# libc evidence for the bare keys is above `assets:`; the alpine leg is what
# makes the universal claim evidence rather than assertion.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── PASS 2 (darwin) — LANDED ───────────────────────────────────────────────
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  # ── PASS 3 (windows) — LANDED ──────────────────────────────────────────────
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/google/ko/license --jq '.license.spdx_id'
  #   Apache-2.0
  # The LICENSE file also travels INSIDE every release archive, so the terms
  # ship with the redistributed bytes.
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: google/ko
  fork: ocx-contrib/index
